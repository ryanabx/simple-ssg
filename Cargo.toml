[package]
name = "simple-ssg"
authors = ["Ryan Brue <ryanbrue.dev@gmail.com>"]
repository = "https://github.com/ryanabx/simple-ssg"
website = "https://ryanabx.github.io/simple-ssg"
license = "MIT"
readme = "README.md"
version = "5.0.0"
edition = "2021"
description = "Simplest static site generator for Markdown"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.16", features = ["derive"] }
env_logger = "0.11.5"
log = "0.4.22"
pulldown-cmark = "0.12.1"
walkdir = "2.5.0"

[dev-dependencies]
rand = "0.8.5"
